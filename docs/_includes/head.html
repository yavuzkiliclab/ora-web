<meta name="twitter:image" content="https://yavuzkiliclab.github.io/ora-web/assets/hero-istanbul-poster.jpg">
<link rel="icon" type="image/png" href="{{ '/assets/img/ora-mark-dark.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --marine:#12384F;        /* marin: artik VURGU/derinlik rengi, dominant degil */
  --marine-soft:#4A6274;   /* ikincil metin */
  --ink:#16323F;           /* ana metin: koyu ama marin degil, okunur */
  --porcelain:#FBFCFD;     /* FERAH beyaz zemin (hafif mavi ton) */
  --porcelain-deep:#EEF4F7;/* acik mavi panel zemini */
  --sky:#7FB0C4;           /* acik klinik mavisi vurgu */
  --sky-soft:#D5E6ED;      /* cok acik mavi */
  --copper:#B85C38;        /* bakir vurgu: lux imza korunuyor */
  --copper-soft:#C9825F;
  --copper-ink:#8F441F;
  --line:rgba(18,56,79,.12);
  --line-strong:rgba(18,56,79,.26);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Inter",system-ui,sans-serif;background:var(--porcelain);color:var(--ink);
     font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:var(--copper);color:var(--porcelain)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:"Archivo",sans-serif;font-weight:640;line-height:1.04;letter-spacing:-.015em}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,56px)}

/* mikro etiket: koordinat dili */
.coord{font-family:"Archivo",sans-serif;font-stretch:110%;font-weight:500;font-size:11.5px;
       letter-spacing:.32em;text-transform:uppercase;color:var(--copper-ink)}
.coord.dim{color:var(--marine-soft)}

/* ================= HEADER ================= */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--porcelain) 88%,transparent);
       backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;height:74px}
.wordmark{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:760;font-size:26px;
          letter-spacing:.06em;color:var(--marine)}
.wordmark span{color:var(--copper)}
.wordsub{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--marine-soft);
         margin-top:2px;font-weight:500}
.brand-logo{height:44px;width:auto;display:block}
@media(max-width:640px){.brand-logo{height:36px}}
.brand{display:inline-flex;flex-direction:column;gap:3px;line-height:1}
.brand-sub{font-size:10px;letter-spacing:.32em;text-transform:uppercase;
           color:var(--marine-soft);padding-left:2px}
@media(max-width:640px){.brand-sub{display:none}}
/* --- marka filigrani --- */
.wm{position:relative;overflow:hidden}
.wm > .wrap{position:relative;z-index:1}
.wm::before{content:"";position:absolute;z-index:0;pointer-events:none;
  top:50%;transform:translateY(-50%);width:420px;height:420px;
  background:no-repeat center/contain;opacity:.06}
#journey.wm::before{right:40px;left:auto;background-image:url({{ '/assets/img/ora-mark-dark.png' | relative_url }})}
#faq.wm::before{left:40px;right:auto;background-image:url({{ '/assets/img/ora-mark-dark.png' | relative_url }})}
#trust.wm::before{right:40px;left:auto;background-image:url({{ '/assets/img/ora-mark-dark.png' | relative_url }})}
#contact.wm::before{left:40px;right:auto;background-image:url({{ '/assets/img/ora-mark-light.png' | relative_url }});opacity:.08}
@media(max-width:900px){.wm::before{width:300px;height:300px;opacity:.05}}
@media(max-width:640px){.wm::before{display:none}}
@media(max-width:640px){.brand-chip{flex-basis:40%}}
nav.main{display:flex;gap:34px}
nav.main a{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
           color:var(--marine-soft);transition:color .25s;position:relative;padding:4px 0}
nav.main a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1.5px;
                  background:var(--copper);transition:width .3s}
nav.main a:hover{color:var(--marine)}
nav.main a:hover::after{width:100%}
.hcta{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
      border:1.5px solid var(--marine);padding:11px 22px;border-radius:2px;transition:all .3s}
.hcta:hover{background:var(--marine);color:var(--porcelain)}
@media(max-width:900px){nav.main{display:none}}

/* ================= HERO ================= */
.hero{position:relative;padding:clamp(70px,11vh,130px) 0 clamp(60px,9vh,110px);overflow:hidden}
.hero-grid{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:88px 88px;
  mask-image:radial-gradient(ellipse 90% 80% at 70% 10%,black 0%,transparent 68%)}
.hero .coordline{display:flex;gap:26px;align-items:center;margin-bottom:34px}
.hero .coordline .tick{width:44px;height:1px;background:var(--copper)}
.hero h1{font-size:clamp(38px,6vw,86px);font-stretch:115%;max-width:24ch;color:#ffffff}
.hero h1 em{font-style:normal;color:var(--copper)}
.hero p.sub{max-width:52ch;margin-top:30px;font-size:clamp(16px,1.35vw,19px);color:var(--marine-soft)}
.hero-ctas{display:flex;gap:16px;margin-top:42px;flex-wrap:wrap}
.btn{font-family:"Archivo",sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
     font-weight:600;padding:17px 30px;border-radius:2px;transition:all .3s;display:inline-block}
.btn.solid{background:var(--marine);color:var(--porcelain);border:1.5px solid var(--marine)}
.btn.solid:hover{background:var(--copper);border-color:var(--copper)}
.btn.ghost{border:1.5px solid var(--line-strong);color:var(--marine)}
.btn.ghost:hover{border-color:var(--copper);color:var(--copper)}
.hero-meta{display:flex;gap:44px;margin-top:64px;flex-wrap:wrap}
.hero-meta div{border-left:1.5px solid var(--copper);padding-left:16px}
.hero-meta b{display:block;font-family:"Archivo",sans-serif;font-weight:640;font-size:15px;letter-spacing:.02em}
.hero-meta span{font-size:12px;color:var(--marine-soft);letter-spacing:.06em}

/* ================= TICKER ================= */
.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
        overflow:hidden;padding:15px 0;background:var(--porcelain-deep)}
.ticker-inner{display:flex;gap:56px;white-space:nowrap;animation:tick 34s linear infinite;width:max-content}
.ticker-inner span{font-family:"Archivo",sans-serif;font-size:12px;letter-spacing:.3em;
                   text-transform:uppercase;color:var(--marine-soft);font-weight:500}
.ticker-inner span i{font-style:normal;color:var(--copper);margin-right:56px}
@keyframes tick{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker-inner{animation:none}}

/* ================= SECTION BASICS ================= */
section{padding:clamp(72px,10vh,130px) 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:24px;
          margin-bottom:clamp(40px,6vh,70px);flex-wrap:wrap}
.sec-head h2{font-size:clamp(32px,4.4vw,58px);font-stretch:112%}
.sec-head .coord{white-space:nowrap}

/* ================= DISCIPLINES (8) ================= */
#work{background:var(--porcelain-deep);color:var(--ink)}
#work .coord.dim{color:var(--marine-soft)}
#work .sec-head h2{color:var(--ink)}
.disc-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.disc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
      padding:30px 26px 36px;min-height:218px;display:flex;flex-direction:column;gap:14px;
      transition:background .35s;position:relative}
.disc:hover{background:var(--sky-soft)}
.disc .no{font-family:"Archivo",sans-serif;font-weight:300;font-size:14px;color:var(--copper-soft);letter-spacing:.2em}
.disc h3{font-size:19.5px;font-weight:600;font-stretch:108%;color:var(--ink)}
.disc p{font-size:13.5px;color:var(--marine-soft);line-height:1.6;flex:1}
.disc .go{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--copper-soft);
          font-weight:600;opacity:0;transform:translateY(4px);transition:all .3s}
.disc:hover .go{opacity:1;transform:none}
@media(max-width:1020px){.disc-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.disc-grid{grid-template-columns:1fr}}

/* ================= JOURNEY ================= */
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:step;position:relative}
.journey::before{content:"";position:absolute;top:26px;left:6%;right:6%;height:1px;
                 background:repeating-linear-gradient(90deg,var(--line-strong) 0 10px,transparent 10px 20px)}
.step{padding:0 26px;position:relative}
.step .dot{width:52px;height:52px;border:1.5px solid var(--copper);border-radius:50%;
           display:flex;align-items:center;justify-content:center;background:var(--porcelain);
           font-family:"Archivo",sans-serif;font-weight:640;color:var(--copper);margin-bottom:22px;
           position:relative;z-index:1}
.step h3{font-size:19px;margin-bottom:10px;font-stretch:108%}
.step p{font-size:13.5px;color:var(--marine-soft)}
@media(max-width:900px){.journey{grid-template-columns:repeat(2,1fr);row-gap:44px}.journey::before{display:none}}
@media(max-width:560px){.journey{grid-template-columns:1fr}}

/* ================= PACKAGE BAND ================= */
.band{background:var(--porcelain-deep);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.band-inner{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(40px,6vw,90px);align-items:center}
.band h2{font-size:clamp(30px,3.8vw,50px);font-stretch:112%}
.band h2 em{font-style:normal;color:var(--copper)}
.band ul{list-style:none;margin-top:8px}
.band li{padding:15px 0;border-bottom:1px solid var(--line);font-size:15px;display:flex;gap:14px;align-items:baseline}
.band li b{font-family:"Archivo",sans-serif;font-weight:640;min-width:26px;color:var(--copper);font-size:13px}
@media(max-width:900px){.band-inner{grid-template-columns:1fr}}

/* ================= DOCTORS / TECH placeholders ================= */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{border:1px solid var(--line);background:#fff;border-radius:2px;overflow:hidden}
.card .ph{aspect-ratio:4/4.6;background:var(--porcelain-deep);position:relative;
   display:flex;align-items:center;justify-content:center}
.card .ph::before{content:"+";position:absolute;top:14px;left:16px;color:var(--line-strong);font-family:"Archivo",sans-serif}
.card .ph::after{content:"+";position:absolute;bottom:14px;right:16px;color:var(--line-strong);font-family:"Archivo",sans-serif}
.card .ph span{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--marine-soft)}
.card .cb{padding:20px 22px 24px}
.card h3{font-size:17.5px;margin-bottom:4px}
.card p{font-size:13px;color:var(--marine-soft)}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}

/* ================= FAQ TEASER ================= */
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-family:"Archivo",sans-serif;font-size:18px;font-weight:600;
        list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--copper);font-weight:400;font-size:24px;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin-top:12px;color:var(--marine-soft);max-width:70ch}

/* ================= CTA / FOOTER ================= */
#contact{background:var(--marine);color:var(--porcelain);text-align:center}
#contact h2{font-size:clamp(34px,5vw,64px);font-stretch:115%;max-width:20ch;margin:0 auto}
#contact h2 em{font-style:normal;color:var(--copper-soft)}
#contact p{color:rgba(251,250,247,.7);margin:24px auto 40px;max-width:52ch}
#contact .btn.solid{background:var(--copper);border-color:var(--copper)}
#contact .btn.solid:hover{background:var(--porcelain);color:var(--ink);border-color:var(--porcelain)}
footer{background:var(--marine);color:rgba(251,250,247,.6);border-top:1px solid rgba(251,250,247,.14);
       padding:38px 0;font-size:12.5px}
.fgrid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
footer a{border-bottom:1px solid transparent;transition:all .25s}
footer a:hover{color:var(--porcelain);border-color:var(--copper)}
html.js-on .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
html.js-on .reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html.js-on .reveal{opacity:1;transform:none;transition:none}}

/* hero background video */
.hero{position:relative;overflow:hidden}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(14,31,46,.72) 0%,rgba(14,31,46,.55) 45%,rgba(14,31,46,.78) 100%)}
.hero .wrap{position:relative;z-index:2}
.hero::before{content:"";position:absolute;z-index:2;pointer-events:none;
  right:4vw;top:50%;transform:translateY(-50%);width:500px;height:500px;
  background:url({{ '/assets/img/ora-mark-light.png' | relative_url }}) no-repeat center/contain;
  opacity:.12}
.hero-grid{z-index:1;opacity:.25}
.hero .coord.dim{color:rgba(251,250,247,.6)}
.hero .btn.ghost{border:1.5px solid rgba(251,250,247,.4);color:var(--porcelain)}
.hero .btn.ghost:hover{border-color:var(--copper-soft);color:var(--copper-soft)}
.hero-meta b{color:var(--porcelain)}
.hero-meta span{color:rgba(251,250,247,.7)}
.hero p.sub{color:rgba(251,250,247,.85)}
.hero h1 em{color:var(--copper-soft)}
@media(prefers-reduced-motion:reduce){
  .hero-video{display:none}
  .hero{background:url({{ '/assets/hero-istanbul-poster.jpg' | relative_url }}) center/cover}
}


/* ORA marka COK BASKIN */
.hbar a[aria-label="Ora Clinic home"]{display:flex;flex-direction:column;gap:1px;text-decoration:none}
.wordmark{font-family:"Archivo",sans-serif;font-weight:900;font-size:42px;letter-spacing:-.01em;
  color:var(--marine);line-height:.92;font-stretch:125%}
.wordmark span{color:var(--copper);font-size:46px}
.wordsub{font-family:"Archivo",sans-serif;font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--copper);font-weight:700;margin-top:2px}
/* header'i biraz yukselt ki buyuk marka sigsin */
.hbar{align-items:center}


/* ===== YENI BOLUMLER ===== */
/* placeholder ortak stil */
.ph{background:repeating-linear-gradient(45deg,var(--porcelain-deep),var(--porcelain-deep) 10px,#e6eef2 10px,#e6eef2 20px);
  border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;
  color:var(--marine-soft);font-family:"Archivo",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:center;border-radius:3px}

/* marka logolari seridi */
#brands{padding:64px 0;background:var(--porcelain)}
.brand-row{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:32px}
.brand-chip{aspect-ratio:5/2;background:var(--porcelain-deep);border:1px solid var(--line);border-radius:4px;
  display:flex;align-items:center;justify-content:center;padding:14px 18px;flex:0 1 150px}
.brand-chip img{max-width:100%;max-height:38px;width:auto;height:auto;object-fit:contain;opacity:.62;filter:grayscale(1)}

/* paketler */
#packages{padding:96px 0;background:var(--porcelain-deep)}
.pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.pkg-card{background:var(--porcelain);border:1px solid var(--line);border-radius:6px;padding:32px;display:flex;flex-direction:column}
.pkg-card.featured{border:1.5px solid var(--copper);box-shadow:0 12px 40px rgba(18,56,79,.08)}
.pkg-tag{font-family:"Archivo",sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);font-weight:700;margin-bottom:14px}
.pkg-card h3{font-size:23px;font-weight:640;color:var(--ink);margin-bottom:8px;font-stretch:106%}
.pkg-card .pkg-note{font-size:13px;color:var(--marine-soft);margin-bottom:20px}
.pkg-card ul{list-style:none;margin:0 0 24px;padding:0;flex:1}
.pkg-card li{font-size:14px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.pkg-card li::before{content:"+";color:var(--copper);font-weight:700}
.pkg-price{font-size:12px;color:var(--marine-soft);font-style:italic;margin-bottom:16px}

/* sertifikalar */
#trust{padding:88px 0;background:var(--porcelain)}
.cert-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}
.cert{aspect-ratio:1;background:var(--porcelain-deep);border:1px solid var(--line);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.cert .cert-ic{width:46px;height:46px;border-radius:50%;border:2px solid var(--copper);display:flex;align-items:center;justify-content:center;color:var(--copper);font-size:20px}
.cert b{font-size:13px;color:var(--ink);font-family:"Archivo",sans-serif;letter-spacing:.04em}
.cert span{font-size:11px;color:var(--marine-soft)}

/* oncesi sonrasi */
#results{padding:96px 0;background:var(--porcelain-deep)}
.ba-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.ba-card{background:var(--porcelain);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.ba-imgs{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ba-imgs .ph{aspect-ratio:3/4;border-radius:0;border:none}
.ba-card .ba-cap{padding:16px;font-size:13px;color:var(--marine-soft)}
.ba-card .ba-cap b{color:var(--ink);display:block;font-family:"Archivo",sans-serif;font-size:14px;margin-bottom:3px}

/* yorumlar */
#reviews{padding:96px 0;background:var(--porcelain)}
.rev-head{display:flex;gap:40px;align-items:center;margin-top:32px;flex-wrap:wrap}
.rev-score{display:flex;flex-direction:column;gap:4px}
.rev-score .num{font-family:"Archivo",sans-serif;font-size:44px;font-weight:800;color:var(--ink);line-height:1}
.rev-score .stars{color:var(--copper);font-size:18px;letter-spacing:2px}
.rev-score .src{font-size:12px;color:var(--marine-soft);letter-spacing:.08em}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.rev-card{background:var(--porcelain-deep);border:1px solid var(--line);border-radius:6px;padding:26px}
.rev-card .stars{color:var(--copper);font-size:14px;letter-spacing:2px;margin-bottom:12px}
.rev-card p{font-size:14px;color:var(--ink);line-height:1.65;margin-bottom:16px;font-style:italic}
.rev-card .who{font-size:12px;color:var(--marine-soft);font-family:"Archivo",sans-serif;letter-spacing:.06em}

/* saglik rehberi */
#guide{padding:96px 0;background:var(--porcelain-deep)}
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.guide-card{background:var(--porcelain);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.guide-card .ph{aspect-ratio:16/9;border-radius:0;border:none;border-bottom:1px solid var(--line)}
.guide-card img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;display:block}
