const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{root:null,rootMargin:"0px 0px 9000px 0px",threshold:0});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
